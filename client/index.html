    <!-- Theme Script - MUST run before any content renders to prevent flash -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          
          // If no saved theme, use system preference or default to light
          if (!theme) {
            theme = systemDark ? 'dark' : 'light';
          }
          
          // Apply theme immediately
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Critical inline CSS for LCP optimization - prevents FOUC and speeds up rendering -->
    <style>
      html{scroll-behavior:smooth}body{margin:0;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;background-color:#fafafa}html.dark body{background-color:#0a0a0a}#root{min-height:100vh}@media(prefers-reduced-motion:reduce){*,::after,::before{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
