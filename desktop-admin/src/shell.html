<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8" />
<title>LeFlow Admin</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100vh;
    overflow: hidden;
    background: #0a0a0c;
    font-family: "Figtree", "Segoe UI", sans-serif;
    user-select: none;
    color: #e4e4e8;
    -webkit-font-smoothing: antialiased;
  }
  .shell {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
    position: relative;
  }

  /* Subtle depth: a soft neutral vignette plus a faint accent bloom
     anchored behind the panel, so it reads as "floating", not flat. */
  .glow {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(64rem 44rem at 50% -14%, rgba(255, 255, 255, 0.04), transparent 62%),
      radial-gradient(38rem 30rem at 50% 32%, hsla(248, 70%, 58%, 0.09), transparent 68%);
  }


  /* ---------- Top strip ---------- */
  .topbar {
    -webkit-app-region: drag;
    height: 42px;
    flex-shrink: 0;
    z-index: 2;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    background: #0d0d10;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
  }
  .topbar-side { display: flex; align-items: center; height: 100%; }
  .topbar-side.right { justify-content: flex-end; }
  .topbar-left {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    -webkit-app-region: no-drag;
    height: 100%;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px 0 6px;
    -webkit-app-region: drag;
  }
  .brand img { height: 20px; width: auto; opacity: 1; }
  .brand span { font-size: 12px; font-weight: 700; color: #c8c9d1; letter-spacing: 0.4px; }

  .nav-btn {
    -webkit-app-region: no-drag;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border: none;
    background: transparent;
    border-radius: 6px;
    color: #82848d;
    cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease;
  }
  .nav-btn:hover { background: rgba(255, 255, 255, 0.06); color: #e4e4e8; }
  .nav-btn.active-section { color: #d4d1ff; }
  .nav-btn svg { width: 14px; height: 14px; }

  /* macOS-style traffic lights, top-left - deliberately not the Windows
     minimize/maximize/X-in-top-right layout every browser also uses, so
     this reads as its own app at a glance. */
  .traffic-lights {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 6px 0 16px;
    height: 100%;
    -webkit-app-region: no-drag;
  }
  .traffic-light {
    -webkit-app-region: no-drag;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: none;
    padding: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .traffic-light svg {
    width: 7px;
    height: 7px;
    opacity: 0;
    color: rgba(0, 0, 0, 0.55);
    transition: opacity 0.08s ease;
  }
  .traffic-lights:hover .traffic-light svg { opacity: 1; }
  .traffic-light.close { background: #ff5f57; }
  .traffic-light.minimize { background: #febc2e; }
  .traffic-light.maximize { background: #28c840; }
  .traffic-light:active { filter: brightness(0.85); }
  /* Unfocused-window convention: flat gray dots, like macOS does for
     background windows. Toggled via .is-blurred on <body>. */
  body.is-blurred .traffic-light { background: #3a3b40; }

  .section-crumb {
    -webkit-app-region: no-drag;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    color: #c4c5cc;
    padding: 0 2px 0 8px;
  }
  .section-crumb::before {
    content: "/";
    color: #4a4b52;
    font-weight: 400;
  }

  /* ---------- Body ---------- */
  .body-area { flex: 1; min-height: 0; position: relative; z-index: 1; }

  .launcher {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    display: flex;
    justify-content: center;
    padding: 8vh 24px 40px;
  }

  .launcher-inner {
    width: 100%;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: panel-in 0.32s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes panel-in {
    from { opacity: 0; transform: translateY(12px) scale(0.985); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .greeting {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 26px;
  }
  .greeting-avatar {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(155deg, hsla(248, 75%, 60%, 0.9), hsla(258, 65%, 42%, 0.9));
    border: 1px solid hsla(248, 60%, 78%, 0.3);
    box-shadow: 0 6px 16px -6px hsla(248, 80%, 45%, 0.55);
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
  }
  .greeting-text { text-align: left; }
  .greeting h1 {
    margin: 0 0 3px;
    font-size: 20px;
    font-weight: 650;
    letter-spacing: -0.01em;
    color: #f5f5f8;
  }
  .greeting p {
    margin: 0;
    font-size: 12.5px;
    color: #71737d;
  }

  .launcher-panel {
    width: 100%;
    background: rgba(16, 16, 20, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 18px;
    box-shadow:
      0 30px 70px -24px rgba(0, 0, 0, 0.7),
      0 10px 28px -14px hsla(248, 60%, 40%, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.05);
    overflow: hidden;
  }

  .launcher-footer {
    margin-top: 22px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #4a4b53;
    letter-spacing: 0.02em;
  }
  .launcher-footer img {
    height: 11px;
    width: auto;
    opacity: 0.55;
  }

  .search-wrap {
    position: relative;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
  }
  .search-wrap svg {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    width: 15px;
    height: 15px;
    color: #63656e;
    pointer-events: none;
  }
  .search-input {
    -webkit-app-region: no-drag;
    width: 100%;
    height: 46px;
    border: none;
    background: transparent;
    color: #e4e4e8;
    font-family: inherit;
    font-size: 13.5px;
    padding: 0 16px 0 46px;
    outline: none;
  }
  .search-input::placeholder { color: #63656e; }

  .launcher-scroll {
    max-height: 56vh;
    overflow-y: auto;
    padding: 6px 8px;
  }

  .launcher-group { margin-bottom: 2px; }
  .launcher-group-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.13em;
    color: #5c5e66;
    padding: 12px 10px 6px;
  }
  .launcher-list {
    display: flex;
    flex-direction: column;
  }
  .tile {
    -webkit-app-region: no-drag;
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    background: none;
    border: none;
    border-radius: 9px;
    cursor: pointer;
    font-family: inherit;
    color: #c6c7cf;
    padding: 9px 10px;
    text-align: left;
    transition: background 0.1s ease;
  }
  .tile:hover { background: rgba(255, 255, 255, 0.05); }
  .tile:hover .tile-icon {
    border-color: rgba(124, 108, 245, 0.5);
    color: #c2bdff;
    background: linear-gradient(155deg, rgba(124, 108, 245, 0.22), rgba(124, 108, 245, 0.08));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 4px 12px -4px hsla(248, 80%, 55%, 0.35);
  }
  .tile:hover .tile-label { color: #f4f4f6; }
  .tile:active { background: rgba(255, 255, 255, 0.03); }
  .tile-icon {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(155deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.015));
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    color: #9a9ca6;
    flex-shrink: 0;
    transition: border-color 0.12s ease, color 0.12s ease, background 0.12s ease, box-shadow 0.12s ease;
  }
  .tile-icon svg { width: 15px; height: 15px; }
  .tile-label {
    font-size: 13px;
    font-weight: 500;
    color: #d1d2d8;
    transition: color 0.12s ease;
  }
  .tile-chevron {
    margin-left: auto;
    width: 13px;
    height: 13px;
    color: #40414a;
    flex-shrink: 0;
  }
  .tile.hidden { display: none; }

  /* Thin scrollbar for the launcher panel's internal scroll area */
  .launcher-scroll { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.14) transparent; }
  .launcher-scroll::-webkit-scrollbar { width: 8px; }
  .launcher-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 999px; }
  .launcher-scroll::-webkit-scrollbar-track { background: transparent; }

  .content-view-slot { position: absolute; inset: 0; pointer-events: none; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="shell">
    <div class="topbar" id="topbar">
      <div class="topbar-side left">
        <div class="traffic-lights">
          <button class="traffic-light close" id="close" title="Zatvori">
            <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2.5 2.5l5 5M7.5 2.5l-5 5"/></svg>
          </button>
          <button class="traffic-light minimize" id="minimize" title="Minimizuj">
            <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 5h6"/></svg>
          </button>
          <button class="traffic-light maximize" id="maximize" title="Maksimizuj">
            <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.5V3.5a1 1 0 011-1h3M8 3.5v3a1 1 0 01-1 1H4"/></svg>
          </button>
        </div>
      </div>
      <div class="topbar-left">
        <button class="nav-btn" id="home" title="Početna">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg>
        </button>
        <div class="brand">
          <img src="assets/logo.png" alt="LeFlow" />
          <span>LEFLOW ADMIN</span>
        </div>
        <div class="section-crumb" id="section-crumb" style="display:none">
          <span id="section-label"></span>
        </div>
      </div>
      <div class="topbar-side right"></div>
    </div>

    <div class="body-area">
      <div class="launcher" id="launcher">
        <div class="launcher-inner">
          <div class="greeting">
            <div class="greeting-avatar" id="greeting-avatar">L</div>
            <div class="greeting-text">
              <h1 id="greeting-title">Zdravo</h1>
              <p>Šta radimo danas?</p>
            </div>
          </div>
          <div class="launcher-panel">
            <div class="search-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input class="search-input" id="search" type="text" placeholder="Pretraži sekcije..." />
            </div>
            <div class="launcher-scroll" id="launcher-groups"></div>
          </div>
          <div class="launcher-footer"><img src="assets/logo.png" alt="" /> Studio LeFlow &middot; Admin Desktop</div>
        </div>
      </div>
      <div class="content-view-slot"><!-- BrowserView paints exactly over this rect when a tile is open --></div>
    </div>
  </div>

  <script src="shell.js"></script>
</body>
</html>
